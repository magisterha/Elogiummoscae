        .main-layout {

            padding-bottom: calc(45vh + 2rem);
            min-height: 100vh;
        }
        #marginalia-sinistra {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 45vh;
            z-index: 50;
            border-top: 2px solid #d6d3d1;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            transform: translateY(0);
            transition: transform 0.3s ease-in-out;
        }
        @media (min-width: 1024px) {
            .main-layout {
                display: grid;
                grid-template-columns: 22rem 1fr;
                gap: 2rem;
                padding: 2rem;
                padding-bottom: 2rem;
            }
            #marginalia-sinistra {

                top: 2rem;
                bottom: auto;
                left: auto;
                right: auto;
                height: calc(100vh - 4rem);
                width: auto;

        /**
         * Renderiza el texto griego en el panel principal, envolviendo cada palabra con un span clickeable.
         */
        function reddeParagrafum() {
            let allText = paragrafus.orationes.map(o => o.textus_latinus).join(' ');
            let allVerba = paragrafus.orationes.flatMap(o => o.verba.map(v => ({...v, oratioId: o.id_orationis})));
            
            // Crea un mapa de palabras para una búsqueda más rápida
            const verbaMap = new Map(allVerba.map(v => [v.terminus, v]));

            // Expresión regular para tokenizar el texto, separando palabras de puntuación y espacios
            const tokens = allText.split(/([,.·:;])|(\s+)/).filter(Boolean);
            
            let htmlContentus = '';
            tokens.forEach(token => {
                // Limpia el token de cualquier carácter no deseado que pudiera haberse colado
                const cleanToken = token.trim();

                // Si el token es un espacio o un token de puntuación, lo añade sin procesar
                if (!cleanToken) {
                    htmlContentus += token;
                } else {
                    const verbumData = verbaMap.get(cleanToken);
                    if (verbumData) {
                        htmlContentus += `<span class="verbum" data-verbum-id="${verbumData.id_verbi}" data-oratio-id="${verbumData.oratioId}">${cleanToken}</span>`;
                    } else {
                        htmlContentus += cleanToken;
                    }
                }
            });

            paragrafusContentus.innerHTML = htmlContentus;
        }

                            <p class="text-gray-700 mt-1">${activumVerbum.analysis_morphologicus}</p>
                            <p class="text-gray-700 mt-1"><strong>Significado:</strong> ${activumVerbum.significationes.es}</p>
                        </div>
                        <div>
                            <h5 class="font-bold text-sm uppercase text-gray-500 tracking-wider mt-4">形態分析 (中文)</h5>
                            <p class="text-gray-700 mt-1">${activumVerbum.analysis_morphologicus_zh}</p>
                            <p class="text-gray-700 mt-1"><strong>意義:</strong> ${activumVerbum.significationes.zh || 'Traducción no disponible'}</p>
                        </div>
                    </div>`;
            } else {
                htmlContentus += `<div class="p-4 bg-stone-200 rounded-md text-gray-600"><p>Seleccione una palabra para ver su análisis.</p></div>`;
            }
            htmlContentus += `</section>`;

            // Sección de traducción de la frase
            if (activaOratio) {
                htmlContentus += `
                    <hr class="border-stone-300 my-6">
                    <section id="analysis-orationis-section">
                        <h3 class="text-xl font-semibold text-gray-800 mb-4">Traducción de la Frase / 句子翻譯</h3>
                        <div class="space-y-3">
                             <p class="text-gray-800 textum-classicum bg-stone-200 p-3 rounded-md">${activaOratio.textus_latinus}</p>
                             <div class="text-gray-700 mt-2">${activaOratio.translationes.es}</div>
                             <div class="text-gray-700 mt-2">${activaOratio.translationes.zh}</div>
                        </div>
                    </section>`;
            }

            marginaliaContentus.innerHTML = htmlContentus;
        }

        /**
         * Manejador de eventos para el clic en las palabras.
         */
        paragrafusContentus.addEventListener('click', (e) => {
            const verbumTarget = e.target.closest('.verbum');

            // Si se hace clic fuera de una palabra, deseleccionar
            if (!verbumTarget) {
                document.querySelectorAll('.activus').forEach(el => el.classList.remove('activus'));
                activumVerbum = null;
                activaOratio = null;
                actualizaMarginalia();
                return;
            }

            // Remover la clase 'activus' de cualquier palabra previamente seleccionada
            document.querySelectorAll('.activus').forEach(el => el.classList.remove('activus'));

            const verbumId = verbumTarget.dataset.verbumId;
            const oratioId = verbumTarget.dataset.oratioId;

            // Encontrar la oración y la palabra correspondientes
            activaOratio = paragrafus.orationes.find(o => o.id_orationis === oratioId);
            if (activaOratio) {
                activumVerbum = activaOratio.verba.find(v => v.id_verbi === verbumId);
            }

            // Marcar la palabra seleccionada como activa
            verbumTarget.classList.add('activus');

            // Actualizar el panel lateral con la nueva información
            actualizaMarginalia();
        });

        // Inicializar la interfaz al cargar la página
        reddeParagrafum();
        actualizaMarginalia();
    });
    </script>
</body>
</html>
